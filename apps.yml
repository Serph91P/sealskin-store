extension_groups:
  code_files: &code_files
    - txt
    - md
    - py
    - js
    - ts
    - html
    - css
    - scss
    - json
    - yaml
    - yml
    - toml
    - xml
    - sh
    - bash
    - java
    - kt
    - c
    - cpp
    - h
    - cs
    - go
    - rs
    - rb
    - php

apps:
- id: "webtop-vscode"
  name: "VS Code (KDE Arch)"
  logo: "https://raw.githubusercontent.com/microsoft/vscode/main/resources/linux/code.png"
  url: "https://github.com/Serph91P/docker-webtop-vscode"
  provider: "docker"
  provider_config:
    image: "ghcr.io/serph91p/docker-webtop-vscode:latest"
    port: 3000
    nvidia_support: true
    dri3_support: true
    type: "desktop"
    autostart: false
    url_support: false
    open_support: true
    extensions:
      - *code_files
    docker_overrides:
      security_opt:
        - "seccomp=unconfined"

- id: "webtop-plezy"
  name: "Plezy"
  logo: "https://raw.githubusercontent.com/edde746/plezy/main/assets/plezy.png"
  url: "https://github.com/Serph91P/docker-webtop-plezy"
  # Last published digest: sha256:d8e51dec1a9ba14614d3b3271eb33576db8e55e7852a7655fca45923c2c34801
  provider: "docker"
  provider_config:
    image: "ghcr.io/serph91p/docker-webtop-plezy:2.5.0-ls7"
    port: 3000
    nvidia_support: true
    dri3_support: true
    type: "desktop"
    autostart: false
    url_support: false
    open_support: false
    extensions: []
    docker_overrides:
      security_opt:
        - "seccomp=unconfined"
